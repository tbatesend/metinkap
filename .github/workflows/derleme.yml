name: build

# Tek amaci: exe'nin nasil uretildigi herkesin gorebilecegi, tekrarlanabilir
# bir yerde dursun. Bu ayni zamanda ucretsiz kod imzalama programlarinin
# (SignPath Foundation gibi) sart kostugu sey: ikili dosya birinin
# masaustunden degil, dogrulanabilir bir build'den cikmali.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Report what the runner can do
        # Bilgi amacli, isi dusurmez: Windows Server uzerinde hic OCR dili
        # kurulu olmayabiliyor. Asagidaki adimlar buna gore davraniyor.
        shell: pwsh
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "from winrt.windows.media.ocr import OcrEngine; ls=[l.language_tag for l in OcrEngine.available_recognizer_languages]; print('OCR languages on this runner:', ', '.join(ls) if ls else 'NONE')"

      - name: Run the tests that need no window
        run: python tests/calistir.py --hizli

      - name: Build the exe
        # --icon, --specpath'e gore cozuluyor: "docs/metinkap.ico" burada
        # build/docs/metinkap.ico olup bulunamiyordu. exe-olustur.bat'ta sorun
        # cikmamasinin sebebi orada yolun zaten mutlak olmasi (%~dp0).
        run: |
          pyinstaller --noconfirm --clean `
            --name MetinKap --onefile --windowed `
            --icon "$env:GITHUB_WORKSPACE\docs\metinkap.ico" `
            --distpath dist --workpath build --specpath build `
            --collect-submodules winrt --collect-binaries winrt `
            --hidden-import winrt.windows.foundation.collections `
            metinkap.py

      - name: Verify the exe runs
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MetinKap.exe -ArgumentList '--selftest' `
                             -Wait -PassThru -NoNewWindow
          Write-Host "--selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: MetinKap-exe
          path: dist/MetinKap.exe
          retention-days: 30
